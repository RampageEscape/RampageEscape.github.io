<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1b1d22">
  <title>Rampage Escape 暴走大逃亡</title>
  <meta name="description" content="2.5D 等距視角街機警車追逐遊戲：滑動閃避、衝刺撞毀警車。Isometric arcade police-chase game: swipe to dodge, dash to smash cop cars.">
  <meta property="og:title" content="Rampage Escape 暴走大逃亡">
  <meta property="og:description" content="滑動閃避、衝刺撞毀警車！Swipe to dodge, dash to smash cop cars!">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='8' width='36' height='48' rx='8' fill='%23d8261d'/%3E%3Crect x='19' y='20' width='26' height='14' rx='3' fill='%2326313c'/%3E%3Crect x='29' y='8' width='6' height='48' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- Three.js 放在站内，不依赖外部 CDN，各地访问更稳定 -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-left">
        <div id="score">0</div>
        <div id="distance"></div>
        <div id="coins"></div>
        <ul id="missions"></ul>
      </div>
      <div id="progress" class="hidden">
        <div class="pg-bar"><div class="pg-fill"></div></div>
        <div class="pg-text"></div>
      </div>
      <div class="hud-right">
        <div id="stars"></div>
        <div class="bar hp"><div id="hp-fill"></div></div>
        <div class="bar fever"><div id="fever-fill"></div></div>
        <div id="shields"></div>
        <div class="bar bust"><div id="bust-fill"></div></div>
      </div>
    </div>
    <div id="roadblock" class="hidden">
      <div class="rb-title" data-i18n="roadblock">⚠ 前方路障！</div>
      <div class="rb-lanes"></div>
    </div>
    <div id="junction" class="hidden">
      <div class="jn-title"></div>
      <div class="jn-options"></div>
    </div>
    <div id="combo"></div>
    <button id="fire-btn" class="hidden" data-i18n-aria="fire"><span data-i18n="fire">開炮</span></button>
    <button id="dash-btn" data-i18n-aria="dashAria"><span data-i18n="dash">衝刺</span></button>
  </div>

  <div id="rampage-fx" class="hidden"></div>
  <div id="banner"></div>
  <div id="popups"></div>
  <div id="flash"></div>

  <button id="lang-btn" data-i18n="langButton" data-i18n-aria="langAria">English</button>

  <div id="title" class="screen">
    <h1>RAMPAGE ESCAPE</h1>
    <p class="sub" data-i18n="subtitle">警車追逐 · 衝刺撞毀</p>
    <ul class="help">
      <li data-i18n="helpLanes"><b>← →</b> 滑動切換車道</li>
      <li data-i18n="helpSpeed"><b>↑ ↓</b> 滑動加速 / 剎車</li>
      <li data-i18n="helpDash"><b>雙擊 / DASH / 空白鍵</b> 衝刺：無敵，撞毀警車</li>
      <li data-i18n="helpJunction"><b>路口</b> 滑動選擇岔路，通往不同地圖</li>
      <li data-i18n="helpStation"><b>改裝站</b> 升級車輛，一路進化成坦克！</li>
      <li data-i18n="helpRampage"><b>擦邊、撞毀</b> 累積暴走值，滿了進入暴走模式！</li>
    </ul>
    <div class="btn-row">
      <button id="mode-levels" data-i18n="modeLevels">闖關模式</button>
      <button id="mode-endless" class="alt" data-i18n="modeEndless">無盡模式</button>
      <button id="open-garage" class="alt" data-i18n="garage">車庫</button>
    </div>
    <p id="title-coins"></p>
  </div>

  <div id="levels" class="screen hidden">
    <h2 data-i18n="modeLevels">闖關模式</h2>
    <div id="level-grid"></div>
    <button id="levels-back" class="alt" data-i18n="back">返回</button>
  </div>

  <div id="garage" class="screen hidden">
    <h2 data-i18n="garageTitle">車庫：永久升級</h2>
    <p id="garage-coins"></p>
    <div id="garage-grid"></div>
    <button id="garage-back" class="alt" data-i18n="back">返回</button>
  </div>

  <div id="upgrade" class="screen hidden">
    <h2 data-i18n="upgradeTitle">改裝站：選擇一項升級</h2>
    <div id="upgrade-cards"></div>
  </div>

  <div id="complete" class="screen hidden">
    <h2 data-i18n="complete">逃脫成功！</h2>
    <div id="complete-stars"></div>
    <ul id="complete-goals"></ul>
    <p id="complete-stats"></p>
    <p class="coin-line" id="complete-coins"></p>
    <div class="btn-row">
      <button id="complete-next" data-i18n="next">下一關</button>
      <button id="complete-retry" class="alt" data-i18n="retryLevel">再玩一次</button>
      <button id="complete-menu" class="alt" data-i18n="menu">主選單</button>
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <h2 id="over-reason"></h2>
    <p id="over-stats"></p>
    <p id="best"></p>
    <p class="coin-line" id="over-coins"></p>
    <div class="btn-row">
      <button id="retry-btn" data-i18n="retry">再來一次</button>
      <button id="over-menu" class="alt" data-i18n="menu">主選單</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
